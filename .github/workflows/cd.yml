name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  build-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/matheusperillo03/mkjs-backend:latest
            ghcr.io/matheusperillo03/mkjs-backend:${{ github.sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: |
            ghcr.io/matheusperillo03/mkjs-nginx:latest
            ghcr.io/matheusperillo03/mkjs-nginx:${{ github.sha }}

  deploy:
    needs: [build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Write kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply secret from GitHub secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          kubectl create secret generic mkjs-secret \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            -n mkjs --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: kubectl apply -f k8s/ --prune=false

      - name: Apply cert-manager resources
        run: kubectl apply -f k8s/cert-manager/

      - name: Update images to SHA tag
        run: |
          kubectl set image deployment/backend backend=ghcr.io/matheusperillo03/mkjs-backend:${{ github.sha }} -n mkjs
          kubectl set image deployment/nginx nginx=ghcr.io/matheusperillo03/mkjs-nginx:${{ github.sha }} -n mkjs

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n mkjs --timeout=120s
          kubectl rollout status deployment/nginx -n mkjs --timeout=120s
