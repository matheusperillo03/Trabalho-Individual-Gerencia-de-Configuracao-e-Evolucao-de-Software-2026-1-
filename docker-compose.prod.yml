services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ssl_certs:/etc/ssl
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://mkjs:mkjs@db:5432/mkjs
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mkjs
      POSTGRES_PASSWORD: mkjs
      POSTGRES_DB: mkjs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkjs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ssl_certs:
